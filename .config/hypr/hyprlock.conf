# ============================================================================
# hyprlock Configuration
# Monokai Pro theme
# ============================================================================

background {
    monitor =
    color = rgb(2d2a2e)
}

input-field {
    monitor =
    size = 300, 50
    outline_thickness = 2
    dots_size = 0.25
    dots_spacing = 0.15
    dots_center = true
    outer_color = rgb(ab9df2)
    inner_color = rgb(403e41)
    font_color = rgb(fcfcfa)
    font-family = Rubik SemiBold
    fade_on_empty = true
    fade_timeout = 2000
    placeholder_text = <i>Password...</i>
    check_color = rgb(78dce8)
    fail_color = rgb(ff6188)
    fail_text = <i>$FAIL</i>
    capslock_color = rgb(fc9867)

    position = 0, -80
    halign = center
    valign = center
}

# Time
label {
    monitor =
    text = cmd[update:1000] echo "$(date +%H:%M)"
    color = rgb(78dce8)
    font_size = 144
    font_family = Rubik SemiBold

    position = 0, 200
    halign = center
    valign = center
}

# Date
label {
    monitor =
    text = cmd[update:60000] echo "$(date +"%A, %B %d")"
    color = rgb(727072)
    font_size = 18
    font_family = Rubik SemiBold

    position = 0, 30
    halign = center
    valign = center
}

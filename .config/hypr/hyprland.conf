# ============================================================================
# Hyprland Configuration
# Monokai Pro theme
# ============================================================================

# Palette reference (Monokai Pro base variant):
#   bg:      2d2a2e    sidebar: 221f22    panel:   403e41
#   border:  19181a    fg:      fcfcfa    muted:   727072
#   red:     ff6188    orange:  fc9867    yellow:  ffd866
#   green:   a9dc76    cyan:    78dce8    purple:  ab9df2

$mod = SUPER

# ============================================================================
# Monitors
# ============================================================================

# Primary: 4k 240Hz (update output name after first boot with `hyprctl monitors`)
monitor = DP-1, 3840x2160@240, 0x0, 1.5

# Secondary: LG 5k presenting as 4k 60Hz via Thunderbolt
monitor = DP-2, 3840x2160@60, 2560x0, 1.5

# Fallback for hotplug or unknown outputs
monitor = , preferred, auto, 1.5

# ============================================================================
# Workspace to monitor binding
# ============================================================================

workspace = 1, monitor:DP-1, persistent:true, default:true
workspace = 2, monitor:DP-1, persistent:true
workspace = 3, monitor:DP-1, persistent:true
workspace = 4, monitor:DP-1, persistent:true
workspace = 5, monitor:DP-1, persistent:true
workspace = 6, monitor:DP-2, persistent:true, default:true
workspace = 7, monitor:DP-2, persistent:true
workspace = 8, monitor:DP-2, persistent:true
workspace = 9, monitor:DP-2, persistent:true
workspace = 10, monitor:DP-2, persistent:true

# ============================================================================
# Environment
# ============================================================================

env = XCURSOR_SIZE, 24
env = XCURSOR_THEME, Adwaita
env = QT_QPA_PLATFORMTHEME, qt6ct

# Xwayland apps get unscaled native pixels; GTK/Qt apps scale themselves
env = GDK_SCALE, 1.5
env = QT_SCALE_FACTOR, 1.5

# ============================================================================
# Autostart
# ============================================================================

exec-once = waybar
exec-once = waybar-watch
exec-once = swaync
exec-once = wpaperd
exec-once = hypridle
exec-once = hyprctl setcursor Adwaita 24
exec-once = dbus-update-activation-environment --systemd WAYLAND_DISPLAY XDG_CURRENT_DESKTOP
exec-once = systemctl --user import-environment WAYLAND_DISPLAY XDG_CURRENT_DESKTOP

# ============================================================================
# Input
# ============================================================================

input {
    kb_layout = us
    follow_mouse = 1
    sensitivity = 0

    touchpad {
        natural_scroll = true
    }
}

# ============================================================================
# Appearance
# ============================================================================

general {
    gaps_in = 2
    gaps_out = 2
    border_size = 1

    col.active_border = rgb(78dce8)
    # col.active_border = rgb(ffd866)

    col.inactive_border = rgb(19181a)

    layout = dwindle
    allow_tearing = true
}

decoration {
    rounding = 4

    blur {
        enabled = false
    }

    shadow {
        enabled = false
    }
}

animations {
    enabled = true
    bezier = snappy, 0.05, 0.9, 0.1, 1.0

    animation = windows, 1, 4, snappy
    animation = windowsOut, 1, 4, snappy, popin 80%
    animation = border, 1, 6, default
    animation = fade, 1, 4, default
    animation = workspaces, 1, 4, snappy
}

dwindle {
    pseudotile = true
    preserve_split = true
}

misc {
    force_default_wallpaper = 0
    disable_hyprland_logo = true
    vfr = true
}

# ============================================================================
# Xwayland
# ============================================================================

xwayland {
    force_zero_scaling = true
}

# ============================================================================
# Keybinds
# ============================================================================

# Core
bind = $mod, Return, exec, ghostty
bind = $mod, Space, exec, fuzzel
bind = $mod, Q, killactive,
bind = $mod SHIFT, E, exit,
bind = $mod, V, togglefloating,
bind = $mod, F, fullscreen,
bind = $mod, P, pseudo,
bind = $mod, S, togglesplit,

# Focus (vim + arrows)
bind = $mod, H, movefocus, l
bind = $mod, L, movefocus, r
bind = $mod, K, movefocus, u
bind = $mod, J, movefocus, d
bind = $mod, Left, movefocus, l
bind = $mod, Right, movefocus, r
bind = $mod, Up, movefocus, u
bind = $mod, Down, movefocus, d

# Move windows
bind = $mod SHIFT, H, movewindow, l
bind = $mod SHIFT, L, movewindow, r
bind = $mod SHIFT, K, movewindow, u
bind = $mod SHIFT, J, movewindow, d
bind = $mod SHIFT, Left, movewindow, l
bind = $mod SHIFT, Right, movewindow, r
bind = $mod SHIFT, Up, movewindow, u
bind = $mod SHIFT, Down, movewindow, d

# Resize
bind = $mod CTRL, H, resizeactive, -40 0
bind = $mod CTRL, L, resizeactive, 40 0
bind = $mod CTRL, K, resizeactive, 0 -40
bind = $mod CTRL, J, resizeactive, 0 40

# Workspaces
bind = $mod, 1, workspace, 1
bind = $mod, 2, workspace, 2
bind = $mod, 3, workspace, 3
bind = $mod, 4, workspace, 4
bind = $mod, 5, workspace, 5
bind = $mod, 6, workspace, 6
bind = $mod, 7, workspace, 7
bind = $mod, 8, workspace, 8
bind = $mod, 9, workspace, 9
bind = $mod, 0, workspace, 10

# Move to workspace
bind = $mod SHIFT, 1, movetoworkspace, 1
bind = $mod SHIFT, 2, movetoworkspace, 2
bind = $mod SHIFT, 3, movetoworkspace, 3
bind = $mod SHIFT, 4, movetoworkspace, 4
bind = $mod SHIFT, 5, movetoworkspace, 5
bind = $mod SHIFT, 6, movetoworkspace, 6
bind = $mod SHIFT, 7, movetoworkspace, 7
bind = $mod SHIFT, 8, movetoworkspace, 8
bind = $mod SHIFT, 9, movetoworkspace, 9
bind = $mod SHIFT, 0, movetoworkspace, 10

# Scroll through workspaces on current monitor
bind = $mod, mouse_down, workspace, m-1
bind = $mod, mouse_up, workspace, m+1

# Mouse
bindm = $mod, mouse:272, movewindow
bindm = $mod, mouse:273, resizewindow

# Screenshot (requires grim + slurp)
bind = , Print, exec, grim -g "$(slurp)" - | wl-copy
bind = SHIFT, Print, exec, grim - | wl-copy

# Lock
bind = $mod SHIFT, L, exec, hyprlock

# ============================================================================
# Window Rules
# ============================================================================

# Float common dialogs
windowrule = float on, match:class ^(file_progress)$
windowrule = float on, match:class ^(confirm)$
windowrule = float on, match:class ^(dialog)$
windowrule = float on, match:class ^(download)$
windowrule = float on, match:class ^(notification)$
windowrule = float on, match:class ^(error)$
windowrule = float on, match:class ^(splash)$
windowrule = float on, match:title ^(Open File)$
windowrule = float on, match:title ^(Save File)$
windowrule = float on, match:title ^(Save As)$

# Steam
windowrule = float on, match:class ^(steam)$, match:title ^(Friends List)$
windowrule = float on, match:class ^(steam)$, match:title ^(Steam Settings)$
windowrule = float on, match:class ^(steam)$, match:title ^(Steam - News)$

# Gaming: allow tearing for fullscreen games (reduces input latency)
windowrule = immediate on, match:class ^(steam_app_.*)$
windowrule = immediate on, match:class ^(gamescope)$

# Heroic / Lutris
windowrule = float on, match:class ^(heroic)$, match:title ^(Heroic Games Launcher)$
windowrule = float on, match:class ^(lutris)$
